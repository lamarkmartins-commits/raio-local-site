<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<style>body{margin:0;background:#ddd}iframe{display:block;width:390px;height:844px;border:0}pre{font:16px monospace;padding:12px}</style>
<iframe id="page" title="Prévia móvel" src="/servicos/site-de-pagina-unica.html"></iframe>
<pre id="result">aguardando</pre>
<script>
  const frame = document.getElementById('page');
  frame.addEventListener('load', () => setTimeout(() => {
    const doc = frame.contentDocument;
    doc.querySelector('.menu-toggle').click();
    document.getElementById('result').textContent = JSON.stringify({
      viewport: frame.contentWindow.innerWidth,
      pageWidth: doc.documentElement.scrollWidth,
      menuOpen: !doc.getElementById('menu-mobile').hidden,
      offerLinks: doc.querySelectorAll('.nav-offer').length,
      themeButton: !!doc.querySelector('.theme-toggle')
    });
  }, 250));
</script>
</html>
